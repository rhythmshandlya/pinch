# gain 32 (read with gh api on 2026-11-21; copy in sim/sizing/bam_sts3215_m6.json). The gear version is inferred.
model_name = {value = "m6", unit = "-", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
supply_v = {value = 7.4, unit = "V", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/feetech/actuator.py"}
firmware_kp = {value = 32, unit = "-", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/feetech/actuator.py"}
error_gain = {value = 0.166, unit = "duty per (kp*rad)", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/feetech/actuator.py", why = "BAM read this off an oscilloscope on real STS3215 servos (comment in actuator.py)"}
max_pwm = {value = 0.97, unit = "fraction", source = "estimate", why = "needs bench: BAM marks the 0.97 maximum duty as TODO (found with an oscilloscope, not fitted); 1.0 would be the other plausible value", ref = "https://github.com/Rhoban/bam/blob/main/bam/feetech/actuator.py"}
kt_nm_per_a = {value = 1.2753202369175398, unit = "N*m/A", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
resistance_ohm = {value = 2.753421214375944, unit = "ohm", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
armature_kgm2 = {value = 0.021564290129722483, unit = "kg*m^2", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
error_gain_ratio = {value = 1.1616979929275297, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
max_velocity_rad_s = {value = 5.095754044445978, unit = "rad/s", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
friction_base = {value = 0.0533134815909817, unit = "N*m", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
friction_stribeck = {value = 4.257322248151969e-05, unit = "N*m", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
friction_viscous = {value = 0.028160537042911545, unit = "N*m*s/rad", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_motor = {value = 0.044912012282132555, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_external = {value = 0.24355483356616028, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_motor_stribeck = {value = 0.00012448975632695385, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_external_stribeck = {value = 0.1422905635963302, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_motor_quad = {value = 0.007594943296670792, unit = "1/(N*m)", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_external_quad = {value = 0.00340408727365082, unit = "1/(N*m)", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
dtheta_stribeck = {value = 0.371136775424206, unit = "rad/s", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
alpha = {value = 9.93094944677977, unit = "-", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
stall_torque_nm = {value = 3.427506733774023, unit = "N*m", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json", why = "supply_v * kt / R from the same file: the torque at standstill with the full supply; the maker's printed 19.5 kg*cm (1.91 N*m) is lower, see docs/dev/V2_MODEL.md"}
no_load_speed_rad_s = {value = 5.802464185690227, unit = "rad/s", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json", why = "supply_v / kt: where the back-EMF cancels the supply; the firmware limits the target to max_velocity long before"}

# ---- arm servos: Feetech STS3032 on the serial bus (IDs 13-18), 5 V rail B --------------------------------------
# Owner's decision 2026-11-21: the six arm servos are Feetech STS3032 bus servos (position and load feedback) on the same
# TTL bus as the 12 leg servos; the six GS-4308MG PWM servos and their PWM pins are gone. Evidence: Evelta page opened
# 2026-11-21 (4.5 kg*cm stall, 1.5 kg*cm rated, 4.8-6 V, 20 g, 23.2 x 12.1 x 28.5 mm, 27 in stock).
# Their command delay is the bus's: the twin uses the [leg_servo] delay and SYNC_WRITE numbers for every servo.
[arm_servo]
idle_current_a = {value = 0.015, unit = "A", source = "estimate", why = "needs bench: a small servo's amplifier idles at about 10-20 mA; the STS3032 listing prints no idle current", ref = "hardware/electronics.md"}
stall_torque_kgcm = {value = 4.5, unit = "kg*cm", source = "datasheet", ref = "https://evelta.com/sts3032-6v-4-5kg-360deg-serial-bus-servo-motor", why = "stall torque at 6 V per the Evelta page"}
rated_torque_kgcm = {value = 1.5, unit = "kg*cm", source = "datasheet", ref = "https://evelta.com/sts3032-6v-4-5kg-360deg-serial-bus-servo-motor", why = "rated (continuous) torque at 6 V per the Evelta page"}
stall_current_a = {value = 1.2, unit = "A", source = "datasheet", ref = "https://evelta.com/sts3032-6v-4-5kg-360deg-serial-bus-servo-motor", why = "stall current at 6 V per the Evelta page (the parts decision's figure); at the 5 V of rail B it is a little lower, so 1.2 A is the safe side. Six of them stalled at full torque would draw 7.2 A against the 5 A regulator"}
# the firmware setting that keeps rail B inside its regulator: written into every arm servo by robot/setup_servo.py
# (register torque_limit, address 48, robot/feetech_bus.py; 0-1000 per mille of the maximum torque)
torque_limit_permille = {value = 400, unit = "per mille", source = "estimate", why = "design choice: a motor's current follows its torque, so a 40 % torque limit caps a stalled arm servo at about 0.48 A and all six at 2.9 A, inside the 5 A regulator with room for idle currents. The parts decision's torque model needs 0.69 kg*cm (46 % of RATED, 15 % of stall) at the 2x margin, so 40 % of stall (1.8 kg*cm) still lifts the toy. Register units not yet confirmed on a servo: bench order 1", ref = "configs/wiring_v2.toml"}

# ---- servo heat: the one-node thermal model of every bus servo (crab/servo_model.py ServoHeat) --------------------
# Feetech prints no thermal resistance or time constant. These estimates come from SO-ARM100 users' STS3215 tests
# (issue 134: holding about 15 kg*cm it read 48 C after 10 min and stayed there for an hour; lifting 1.5 kg at 10 cm it
# rose 15 C in 10 min) and are replaced when the phase-3 bench step `heat` fits a real servo (crab.servo_model.fit_heat).
# Another servo (the STS3032) scales the thermal resistance by its case's surface area; tau stays the same.
[servo_heat]
protection_c = {value = 70, unit = "C", source = "datasheet", ref = "https://docs.waveshare.com/Memory_Map_Explanation/ST_Servo_Memory_Map_Explanation", why = "register 13 (maximum temperature limit), factory default 70 C, 1 C steps; the reading is register 63"}
ambient_c = {value = 25, unit = "C", source = "estimate", why = "design choice: the twin's room. A summer room in India reaches 35 C or more; the model takes the room's temperature as a parameter (SimBackend(ambient_c=...))", ref = "crab/servo_model.py"}
sts3215_thermal_resistance_k_per_w = {value = 10.0, unit = "K/W", source = "estimate", why = "needs bench: the SO-ARM100 hold (about 1.47 N*m at the horn; the motor makes 1.06-1.47 N*m of it, BAM's load friction holds the rest: 0.8-1.15 A through 2.75 ohm, 2.3-4 W with the idle draw) settled 23 K above an assumed 25 C room: 6-10 K/W. The upper end is taken, since the board sensor lags the winding", ref = "https://github.com/TheRobotStudio/SO-ARM100/issues/134"}
time_constant_s = {value = 240.0, unit = "s", source = "estimate", why = "needs bench: the SO-ARM100 hold was already steady at 10 min (about 2.5 time constants or more), so tau is at most about 4 min; maxon's small motors of similar mass have 260-500 s whole-motor constants", ref = "https://github.com/TheRobotStudio/SO-ARM100/issues/134"}
copper_tempco_per_k = {value = 0.00393, unit = "1/K", source = "estimate", why = "physical constant: annealed copper's resistance rises 0.393 %/K near 20 C (IACS); Ben Katz's Mini Cheetah temperature observer uses the same coefficient", ref = "https://build-its-inprogress.blogspot.com/2019/10/motor-temperature-estimation-without.html"}

# ---- IMU: Bosch BNO055 in IMU fusion mode (gyro + accelerometer, no magnetometer) ----------------------------
[imu]
fusion_rate_hz = {value = 100, unit = "Hz", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
gyro_noise_rms_dps = {value = 0.3, unit = "deg/s", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
gyro_bandwidth_hz = {value = 32, unit = "Hz", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
gyro_zero_rate_offset_dps = {value = 3.0, unit = "deg/s", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
accel_noise_density_ug = {value = 190, unit = "ug/sqrt(Hz)", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
accel_bandwidth_hz = {value = 62.5, unit = "Hz", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
accel_zero_g_offset_mg = {value = 80, unit = "mg", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
offset_left_after_calibration = {value = 0.25, unit = "fraction", source = "estimate", why = "needs bench: fusion mode runs a background accelerometer and gyro calibration while standing still; we assume three quarters of the datasheet offset is removed, so the tilt bias is about 1 deg", ref = "hardware/electronics.md"}
fusion_lag_s = {value = 0.03, unit = "s", source = "estimate", why = "needs bench: the fusion filter smooths the gravity direction; a first-order lag of about 30 ms is typical and not published", ref = "hardware/electronics.md"}
fusion_accel_tau_s = {value = 0.5, unit = "s", source = "estimate", why = "needs bench: how fast the fusion pulls its gravity direction toward the accelerometer (the rest of the time it follows the gyro); Bosch does not publish it. A larger value hides walking accelerations from the tilt, a smaller one lets them in; measure with a shake test", ref = "hardware/electronics.md"}
i2c_read_delay_s = {value = 0.004, unit = "s", source = "estimate", why = "needs bench: a 12-byte read at 400 kHz I2C plus the Linux driver takes a few ms; it makes every sample that much older", ref = "robot/backends.py"}

# ---- cliff beams: 5 x ST VL53L0X time-of-flight ---------------------------------------------------------------
[distance]
count = 5
max_range_m = {value = 2.0, unit = "m", source = "datasheet", ref = "https://www.pololu.com/product/2490"}
accuracy_best_frac = {value = 0.03, unit = "fraction of range", source = "datasheet", ref = "https://www.pololu.com/product/2490"}
resolution_m = {value = 0.001, unit = "m", source = "datasheet", ref = "https://www.pololu.com/product/2490"}
noise_sigma_frac = {value = 0.015, unit = "fraction of range", source = "estimate", why = "needs bench: Table 12 (p.27) of the ST datasheet gives a standard deviation of 4 % (white, 120 cm) to 7 % (grey, 70 cm) of the distance at 33 ms, indoors; our 1.5 % (half of the +-3 % best-case accuracy) is lower than that at the far end, and the cliff beams look at a few cm where the datasheet gives no figure: measure sigma at 3, 5 and 10 cm over our floor", ref = "https://www.pololu.com/file/0J1187/vl53l0x.pdf"}
noise_sigma_floor_m = {value = 0.002, unit = "m", source = "estimate", why = "needs bench: at a few cm the noise does not shrink below a couple of mm; the ST datasheet gives only percentages (Table 12), no floor: measure at 3 cm", ref = "https://www.pololu.com/file/0J1187/vl53l0x.pdf"}
rate_hz = {value = 30, unit = "Hz", source = "datasheet", why = "ST VL53L0X datasheet DocID029104 Rev 2 (Pololu-hosted copy; ST's own site refused the download): the default 33 ms timing budget (p.23, note 3 of the electrical table; Table 13 lists the 20 ms high-speed profile) = 30 Hz", ref = "https://www.pololu.com/file/0J1187/vl53l0x.pdf"}
fov_deg = {value = 25, unit = "deg", source = "datasheet", why = "ST VL53L0X datasheet sec 5.1 (p.26): 'VL53L0X system FOV is 25 degrees'; the twin's beams are single rays, so this is not used yet", ref = "https://www.pololu.com/file/0J1187/vl53l0x.pdf"}
reliable_range_m = {value = 0.4, unit = "m", source = "datasheet", why = "ST VL53L0X datasheet Table 11 (p.26), grey 17 % target, 33 ms: outdoor overcast (5 kLux) minimum 40 cm and typical 50 cm at >= 94 % detection; indoors with no infrared it is 70 cm minimum. We take the 40 cm row because a lit room is not the dark of the table", ref = "https://www.pololu.com/file/0J1187/vl53l0x.pdf"}
dropout_short = {value = 0.002, unit = "probability per reading", source = "estimate", why = "needs bench: a very occasional invalid reading even on a good surface; the datasheet only guarantees a detection rate of at least 94 % inside the Table 11 range, so our 0.2 % is far inside that bound: count invalid readings on the bench", ref = "https://www.pololu.com/file/0J1187/vl53l0x.pdf"}
dropout_at_max = {value = 0.5, unit = "probability per reading", source = "estimate", why = "needs bench: chance of no answer at the end of the working range, rising linearly from reliable_range_m; the datasheet gives only the 94 % minimum detection rate (Table 11), not the shape beyond it: measure on a dark floor", ref = "https://www.pololu.com/file/0J1187/vl53l0x.pdf"}

# ---- battery monitor: TI INA219 with the 10 mOhm shunt (hardware/BOM.md) -----------------------------------
[power_monitor]
shunt_ohm = 0.01
bus_voltage_step_v = {value = 0.004, unit = "V", source = "datasheet", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf"}
shunt_voltage_step_v = {value = 0.00001, unit = "V", source = "datasheet", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf"}
conversion_time_s = {value = 0.000532, unit = "s", source = "datasheet", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf"}
gain_error_frac = {value = 0.005, unit = "fraction", source = "datasheet", ref = "https://www.ti.com/product/INA219"}
shunt_noise_v = {value = 0.00002, unit = "V", source = "estimate", why = "needs bench: the INA219 datasheet (SBOS448G) prints no noise figure at all, only a +-20 uV typical offset, a 10 uV LSB and 0.1 LSB differential nonlinearity in the electrical characteristics table; 2 LSB (20 uV) is our guess: measure the scatter of a constant current", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf"}

# ---- touch: NXP MPR121 -------------------------------------------------------------------------------------
[touch]
adc_bits = {value = 10, unit = "bits", source = "datasheet", ref = "https://www.nxp.com/docs/en/data-sheet/MPR121.pdf"}
electrodes = {value = 12, unit = "channels", source = "datasheet", ref = "https://www.nxp.com/docs/en/data-sheet/MPR121.pdf"}
sample_interval_s = {value = 0.016, unit = "s", source = "estimate", why = "design choice: 16 ms is the sample period the datasheet quotes its run current at (54 uA); the real period is set by registers we configure ourselves", ref = "https://www.nxp.com/docs/en/data-sheet/MPR121.pdf"}

# ---- camera: OV5647 with a 160 degree lens -------------------------------------------------------------------
[camera]
fov_deg = {value = 160, unit = "deg", source = "estimate", why = "unverified: the listing says 160 deg (hardware/BOM.md); a fisheye's usable field is smaller and we have not measured it", ref = "hardware/BOM.md"}
frame_rate_hz = {value = 30, unit = "Hz", source = "estimate", why = "design choice: a typical OV5647 video mode; the mode we will use is not chosen yet", ref = "hardware/BOM.md"}
latency_s = {value = 0.1, unit = "s", source = "estimate", why = "needs bench: exposure + CSI readout + ISP + the vision model: about 3 frames at 30 Hz", ref = "hardware/BOM.md"}

# ---- microphones: 2 x I2S MEMS --------------------------------------------------------------------------------
[microphones]
count = 2
spacing_m = {value = 0.07, unit = "m", source = "estimate", why = "design choice: they sit about 70 mm apart in the dome (hardware/electronics.md wiring table)", ref = "hardware/electronics.md"}
sample_rate_hz = {value = 16000, unit = "Hz", source = "estimate", why = "design choice: common speech rate for I2S capture; not chosen yet", ref = "hardware/BOM.md"}

# ---- battery: 2S Samsung 25R 18650 pack (2.5 Ah) with its BMS ------------------------------------------------------
# crab/wiring.py Circuit reads it (the twin's default power model) and so does crab/electronics.py Power (the lumped model).
[battery]
cells = 2
capacity_ah = {value = 2.5, unit = "Ah", source = "datasheet", ref = "https://www.18650batterystore.com/products/samsung-25r-18650", why = "the BOM pack is two Samsung INR18650-25R cells in series (2S1P), 2500 mAh each at a 0.2 C discharge; a real pack delivers a little less"}
usable_fraction = {value = 0.8, unit = "fraction", source = "estimate", why = "design choice: 80 % of the rated capacity is usable; the monitor stops the robot at 6.4 V before the pack is flat", ref = "hardware/electronics.md"}
internal_resistance_ohm = {value = 0.06, unit = "ohm", source = "estimate", why = "needs bench: two 25R cells: 13.2 mOhm AC at 1 kHz each (datasheet), about 1.7 times that at DC, so 45 mOhm for the pair, plus 15 mOhm for the BMS MOSFETs and tabs; measure with the INA219 under load", ref = "https://www.18650batterystore.com/products/samsung-25r-18650"}
bms_trip_a = {value = 25.0, unit = "A", source = "estimate", why = "needs bench: the listing gives 8C = 20 A for the cells and no BMS limit; a 2S BMS for 18650 packs usually cuts between 15 and 30 A (the 15 A fuse blows first either way)", ref = "hardware/BOM.md"}
bms_trip_s = {value = 0.1, unit = "s", source = "estimate", why = "needs bench: typical BMS short-circuit / over-current delay of 10-200 ms", ref = "hardware/BOM.md"}
resistance_rise_at_empty = {value = 2.0, unit = "times", source = "estimate", why = "needs bench: LiPo resistance roughly doubles near empty", ref = "hardware/BOM.md"}
ocv_per_cell_v = {value = [4.20, 4.07, 3.98, 3.90, 3.84, 3.79, 3.75, 3.71, 3.66, 3.57, 3.30], unit = "V", source = "estimate", why = "needs bench: a typical LiPo rest-voltage curve; not measured on this pack", ref = "hardware/BOM.md"}

# ---- the lumped model's one servo regulator (crab/electronics.py Power, power_model="lumped" only): the 7.4 V servo
# rail as one buck-boost. The circuit model (the default) has no such part: the leg servos sit on the pack through the
# fuse, shunt and switch, and the two [regulator_5v] modules below feed the computer and the arm servos.
[regulator]
output_v = {value = 7.4, unit = "V", source = "estimate", why = "design choice: the supply voltage BAM fitted the STS3215 at (bam/feetech/actuator.py), so the measured model applies", ref = "docs/research/SIZING_STS3215.md"}
current_limit_a = {value = 12.0, unit = "A", source = "estimate", why = "design choice: walking peaks are far below 12 servos x 2.99 A stall (the sizing study); a regulator for the walking peak plus fall margin is not chosen yet", ref = "docs/research/SIZING_STS3215.md"}
efficiency = {value = 0.9, unit = "fraction", source = "estimate", why = "design choice: same 90 % as the 5 V bucks; a buck-boost is typically a little lower", ref = "hardware/electronics.md"}
dropout_v = {value = 0.0, unit = "V", source = "estimate", why = "design choice: a buck-boost holds 7.4 V from a pack that is above or below it; the 2S pack is 8.4 V full", ref = "docs/research/SIZING_STS3215.md"}
wiring_resistance_ohm = {value = 0.05, unit = "ohm", source = "estimate", why = "needs bench: regulator output, 20 AWG wire, hub and 900 mm servo cables to the servo", ref = "hardware/electronics.md"}
overload_droop_ohm = {value = 1.0, unit = "ohm", source = "estimate", why = "design choice: past the current limit the output folds back; modelled as a steep droop", ref = "hardware/BOM.md"}
computer_load_w = {value = 4.0, unit = "W", source = "estimate", why = "needs bench: Radxa ZERO 3W with Wi-Fi, camera and sensors, as assumed in hardware/electronics.md", ref = "hardware/electronics.md"}

# ====================================================================================================================
# The circuit (crab/wiring.py solves it from configs/wiring_v2.toml every control tick; docs/dev/ELECTRONICS.md)
# ====================================================================================================================

# ---- the two 5 V regulators: 7Semi AP64500 module ----------------------------------------------------------------
[regulator_5v]
output_v = {value = 5.0, unit = "V", source = "datasheet", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter"}
current_limit_a = {value = 5.0, unit = "A", source = "datasheet", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter", why = "5 A continuous per the listing"}
module_min_input_v = {value = 7.0, unit = "V", source = "datasheet", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter", why = "the listing's 7-40 V input range; the chip itself starts at 3.8 V (next line), the module's 7 V is a board-level rating"}
chip_min_input_v = {value = 3.8, unit = "V", source = "datasheet", ref = "https://www.diodes.com/part/AP64500"}
dropout_v = {value = 0.6, unit = "V", source = "estimate", why = "needs bench: a buck at 5 V out needs its input about 0.5-0.7 V higher; the AP64500 datasheet prints no dropout figure (sec 15 only says it enters LDO mode at about 100 % duty, Fig. 6 line regulation starts at 6.5 V in): measure it on the module", ref = "https://www.diodes.com/part/AP64500"}
peak_efficiency = {value = 0.90, unit = "fraction", source = "datasheet", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter", why = "'up to 90 %' per the listing"}
efficiency_points = {value = [[0.05, 0.70], [0.2, 0.82], [1.0, 0.90], [5.0, 0.89]], unit = "[A out, fraction]", source = "estimate", why = "needs bench: a typical buck curve through the listing's 90 % peak. The chip's own Fig. 4 (AP64500 datasheet DS41979 Rev 5-2, p.7, VIN 12 V, 5 V out, the EVM inductor) reads about 0.86 at 50 mA, 0.86 at 0.2 A, 0.90 at 1 A and 0.91 at 5 A (read off the graph), so these points are lower than the chip; the 7Semi module has its own inductor and runs at 7.4-8.4 V in, so measure the module", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter"}
quiescent_a = {value = 0.004, unit = "A", source = "estimate", why = "needs bench: module idle draw from the pack: the chip's own quiescent current is 25 uA typical (datasheet DS41979 p.6) and the rest is the power LED and the module's divider: measure it", ref = "https://www.diodes.com/part/AP64500"}
overload_droop_ohm = {value = 1.0, unit = "ohm", source = "estimate", why = "design choice: past the current limit the output folds back; modelled as a steep droop", ref = "hardware/BOM.md"}
hiccup_factor = {value = 1.3, unit = "x limit", source = "estimate", why = "needs bench: the chip shuts down and retries when the load stays well above its limit: after 512 cycles at the peak limit it stops for 8192 cycles (datasheet sec 7 'hiccup'); the datasheet's peak limit is 9.2 A, the module is sold as 5 A, and the factor of 1.3 is ours: trip it on the bench", ref = "https://www.diodes.com/part/AP64500"}
# design switch, not a measurement: true = the module stops below its 7 V rating (see docs/dev/ELECTRONICS.md)
enforce_module_min = false

# ---- the computer (Radxa ZERO 3W) ---------------------------------------------------------------------------------
[computer]
min_input_v = {value = 4.5, unit = "V", source = "estimate", why = "needs bench: Radxa publishes no minimum; USB-style 5 V inputs are good to 4.75 V and the board's PMIC has a margin: 4.5 V is a conservative reset threshold; measure it", ref = "https://docs.radxa.com/en/zero/zero3"}
hold_up_s = {value = 0.02, unit = "s", source = "estimate", why = "needs bench: the board's own capacitors ride through a dip this long before it resets", ref = "https://docs.radxa.com/en/zero/zero3"}
boot_s = {value = 30.0, unit = "s", source = "estimate", why = "needs bench: kernel, services and the pinch app after a reset; Radxa OS boots in about 20 s", ref = "https://docs.radxa.com/en/zero/zero3"}
power_idle_w = {value = 1.3, unit = "W", source = "estimate", why = "needs bench: RK3566 idle with Wi-Fi associated, camera off; Radxa publishes no figure for the ZERO 3W", ref = "https://docs.radxa.com/en/zero/zero3"}
power_camera_w = {value = 2.1, unit = "W", source = "estimate", why = "needs bench: idle plus the OV5647 stream and the vision model on the CPU", ref = "https://docs.radxa.com/en/zero/zero3"}
power_npu_w = {value = 3.4, unit = "W", source = "estimate", why = "needs bench: camera plus the NPU and CPU busy (speech or a large vision model)", ref = "https://docs.radxa.com/en/zero/zero3"}
rail_3v3_limit_a = {value = 0.5, unit = "A", source = "estimate", why = "needs bench: Radxa publishes no limit for header pins 1 and 17; 0.5 A is the usual budget of a small SBC's 3.3 V pin", ref = "https://docs.radxa.com/en/zero/zero3/hardware-design/hardware-interface"}
rail_3v3_efficiency = {value = 0.85, unit = "fraction", source = "estimate", why = "needs bench: the board makes 3.3 V from its 5 V input with a buck / LDO mix", ref = "https://docs.radxa.com/en/zero/zero3"}

# ---- current drawn by the small parts (at their own supply: 3.3 V unless said) -------------------------------------
[load]
bno055_a = {value = 0.0123, unit = "A", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf", why = "normal power mode, all sensors and fusion running"}
ina219_a = {value = 0.001, unit = "A", source = "datasheet", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf", why = "quiescent supply current, 1 mA maximum"}
mpr121_a = {value = 0.001, unit = "A", source = "estimate", why = "needs bench: the chip runs on tens of uA; the breakout's power LED dominates", ref = "https://www.nxp.com/docs/en/data-sheet/MPR121.pdf"}
panel_a = {value = 0.48, unit = "A", source = "estimate", why = "the Waveshare 6.25 inch HDMI panel takes 2 W at 5 V, at least 400 mA (Waveshare wiki figure as recorded in the 2026-11-21 parts decision, page not re-opened: 0.40 A) plus about 0.4 W (0.08 A) for the Radxa's HDMI transmitter, which the computer's own power figures do not include (parts decision section 2: estimate); it runs from regulator A through its USB-C power lead", ref = "hardware/BOM.md"}
vl53l0x_a = {value = 0.020, unit = "A", source = "datasheet", ref = "https://www.pololu.com/product/2490", why = "about 20 mA typical during ranging, 40 mA peak"}
vl53l5cx_a = {value = 0.100, unit = "A", source = "datasheet", why = "Pololu's VL53L5CX carrier page (quoting ST): typical active-ranging supply current 100 mA, peaks up to 150 mA; the page does not say which mode, so this is the sensor's headline figure, not the 8x8 15 Hz mode we use", ref = "https://www.pololu.com/product/3417"}
mic_a = {value = 0.001, unit = "A", source = "datasheet", why = "MEMSensing MSM261S4030H0R datasheet DS-050 Ver 1.0 p.3: current consumption 750 uA nominal, 1000 uA maximum in normal mode (1 mA used here = the maximum); DFRobot's wiki calls the SEN0526 board MSM261-based but prints no current, so confirm the variant on the board", ref = "https://www.waveshare.com/w/upload/0/01/MSM261S4030H0R.pdf"}
amp_idle_a = {value = 0.00275, unit = "A", source = "datasheet", why = "Maxim MAX98357A/B datasheet p.4 electrical characteristics: quiescent current IDD 2.75 mA typical (3.35 mA max) at VDD = 5 V (2.4 mA at 3.7 V); standby with SD_MODE at 1.8 V and no BCLK is 340 uA", ref = "https://cdn-shop.adafruit.com/product-files/3006/MAX98357A-MAX98357B.pdf"}
amp_peak_w = {value = 0.625, unit = "W", source = "estimate", why = "design choice: the 0.5 W speaker driven flat out at 80 % amplifier efficiency (the mind only plays short tones)", ref = "hardware/BOM.md"}
pogo_charge_a = {value = 2.0, unit = "A", source = "estimate", why = "unverified: the dock charger module's 2 A output (BOM row robu 1794300, read 2026-11-21); the pack takes it through the BMS", ref = "hardware/BOM.md"}

# ---- protection and switching ---------------------------------------------------------------------------------------
[fuse]
rating_a = {value = 15.0, unit = "A", source = "datasheet", ref = "https://www.manualsdir.com/manuals/292034/littelfuse-tac-series.html", why = "the BOM's 15 A 32 V ATC blade fuse (robu R260439)"}
resistance_mohm = {value = 7.0, unit = "mOhm", source = "estimate", why = "needs bench: about 5 mOhm for a cold 15 A blade plus 2 mOhm for the holder's contacts", ref = "hardware/BOM.md"}
# time to open, seconds, at multiples of the rating: 110 % and 135 % are the datasheet limits of the TAC (ATO-type) series
# (110 %: at least 360000 s; 135 %: 0.75 s to 1800 s, taken as their geometric mean 36.7 s); the 200 / 350 / 600 % points
# are typical values of the ATO family remembered, not fetched.
curve = {value = [[1.10, 360000.0], [1.35, 36.7], [2.0, 0.87], [3.5, 0.09], [6.0, 0.03]], unit = "[x rating, s]", source = "estimate", why = "unverified: datasheet limits at 110 % and 135 % (geometric mean of min and max); typical ATO values for the rest", ref = "https://www.manualsdir.com/manuals/292034/littelfuse-tac-series.html"}
cooling_s = {value = 10.0, unit = "s", source = "estimate", why = "needs bench: the element cools in seconds once the current drops below its rating", ref = "hardware/BOM.md"}

[switch]
rating_a = {value = 20.0, unit = "A", source = "estimate", why = "unverified: the BOM's ASW-15D 12 V 20 A rocker; the seller's figure, not measured", ref = "hardware/BOM.md"}
contact_mohm = {value = 15.0, unit = "mOhm", source = "estimate", why = "unverified: rocker switches list 10-50 mOhm initial contact resistance; not listed for this one", ref = "hardware/BOM.md"}

[shunt]
ohm = {value = 0.002, unit = "ohm", source = "estimate", why = "design choice, now in the BOM: 0.005 ohm burns 1.1 W at the fuse's 15 A in a 1 W 2512 resistor (crab/wiring.py rating check); 0.002 ohm burns 0.45 W, gives the INA219 a 5 mA step (10 uV / 2 mOhm) and reads up to 160 A. No Indian shop page found: Mouser India / DigiKey India, priced as an allowance (BOM row UNVERIFIED)", ref = "hardware/BOM.md"}
power_w = {value = 1.0, unit = "W", source = "estimate", why = "design choice: a 2512 chip resistor is sold as 1 W (BOM row 'current-sense resistor, 1 W')", ref = "hardware/BOM.md"}

# ---- connectors (rating per contact, resistance per mated pair) -------------------------------------------------------
[connector.xt60]
rating_a = {value = 30.0, unit = "A", source = "datasheet", why = "Amass XT60-M / XT60-F spec sheet V1.2 (hosted by CMU), p.1-2: rated current 30 A, momentary current 60 A; our SafeConnect pigtails use the same XT60 form but their maker's own sheet was not found", ref = "https://mrsdprojects.ri.cmu.edu/2025teamb/wp-content/uploads/sites/84/2025/05/xt60.pdf"}
contact_mohm = {value = 0.55, unit = "mOhm", source = "datasheet", why = "Amass XT60-M / XT60-F spec sheet V1.2, p.1-2: contact resistance 0.55 mOhm", ref = "https://mrsdprojects.ri.cmu.edu/2025teamb/wp-content/uploads/sites/84/2025/05/xt60.pdf"}
[connector.kk5264]
rating_a = {value = 3.0, unit = "A", source = "estimate", why = "unverified: the 2.54 mm 3-pin housing of the servo cables (Molex KK 254 / 5264 class) is rated about 3 A per contact; the STS3215 stalls at 2.7 A (Waveshare)", ref = "https://www.waveshare.com/wiki/ST3215_Servo"}
contact_mohm = {value = 10.0, unit = "mOhm", source = "estimate", why = "unverified: a tin crimp contact mated: 5-20 mOhm", ref = "hardware/BOM.md"}
[connector.header254]
rating_a = {value = 3.0, unit = "A", source = "estimate", why = "unverified: a 2.54 mm pin header pin: about 3 A", ref = "hardware/BOM.md"}
contact_mohm = {value = 10.0, unit = "mOhm", source = "estimate", why = "unverified: the pin and its housing in series, mated", ref = "hardware/BOM.md"}
[connector.dupont]
rating_a = {value = 1.0, unit = "A", source = "estimate", why = "unverified: female Dupont jumper crimps are good for about 1 A; the Radxa's 5 V input uses two pins in parallel", ref = "hardware/BOM.md"}
contact_mohm = {value = 20.0, unit = "mOhm", source = "estimate", why = "unverified: jumper crimp on a header pin", ref = "hardware/BOM.md"}
[connector.pogo]
rating_a = {value = 1.0, unit = "A", source = "estimate", why = "unverified: the P50-E2 listing gives no rating (BOM: check before trusting it with 2 A); a 1.3 mm spring pin is good for about 1 A, so two pins carry each polarity", ref = "hardware/BOM.md"}
contact_mohm = {value = 50.0, unit = "mOhm", source = "estimate", why = "unverified: a spring probe on a copper plate: tens of mOhm", ref = "hardware/BOM.md"}
[connector.usbc]
rating_a = {value = 3.0, unit = "A", source = "estimate", why = "unverified: a standard USB-C cable carries 3 A; the driver board draws a few mA from it", ref = "hardware/BOM.md"}
contact_mohm = {value = 30.0, unit = "mOhm", source = "estimate", why = "unverified: USB-C cables are specified at up to 40 mOhm per contact path", ref = "hardware/BOM.md"}
[connector.fpc22]
rating_a = {value = 0.5, unit = "A", source = "estimate", why = "unverified: a 0.5 mm pitch flex carries about 0.5 A per contact; the camera takes 0.15 A", ref = "hardware/BOM.md"}
contact_mohm = {value = 50.0, unit = "mOhm", source = "estimate", why = "unverified: a flex-cable contact in its latch connector", ref = "hardware/BOM.md"}
[connector.jst]
rating_a = {value = 2.0, unit = "A", source = "estimate", why = "unverified: JST-PH / SH class housings: 1-2 A", ref = "hardware/BOM.md"}
contact_mohm = {value = 20.0, unit = "mOhm", source = "estimate", why = "unverified: a crimped contact mated with its housing", ref = "hardware/BOM.md"}

[ratings]
transient_factor = {value = 2.0, unit = "x", source = "estimate", why = "design choice: a connector or wire may carry its continuous rating times this for a stall of 2 s or less (the servo's overload protection cuts a longer one); wires and contacts heat over tens of seconds", ref = "hardware/BOM.md"}
slack_factor = {value = 1.25, unit = "x", source = "estimate", why = "design choice: a wire is longer than the straight distance between its two parts: it bends around other parts", ref = "hardware/BOM.md"}
service_loop_mm = {value = 40.0, unit = "mm", source = "estimate", why = "design choice: extra length at each wire for stripping, soldering and strain relief", ref = "hardware/BOM.md"}

