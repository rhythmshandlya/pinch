# Every electronic part of the robot, in one file (hardware/BOM.md, hardware/electronics.md).
# The digital twin reads this when it runs with realism="datasheet" (crab/electronics.py, docs/dev/ELECTRONICS.md).
#
# Every number is an inline table: value, unit, source, ref (and `why` for estimates).
#   source = "measured"  : someone measured this part (a public data set); ref is where.
#   source = "datasheet" : printed in the maker's datasheet or product page; ref is the URL.
#   source = "estimate"  : our own reasoning; `why` says how we got it. Replace when a real number exists.
# Plain keys (count = 5, cells = 2, shunt_ohm) are design facts of our own build, not measurements.
# Datasheet and measured values below were read on 2026-11-21 from the ref given (BNO055 datasheet rev 1.8,
# INA219 datasheet SBOS448G, MPR121 datasheet, Feetech and Pololu product pages, the Rhoban BAM JSON files).
# The ST VL53L0X datasheet itself could not be fetched that day: its numbers come from Pololu's product page
# (which quotes ST) and carry that page as the ref.

# ---- leg servos: Feetech STS3215 (the 7.4 V part the legs are moving to) ------------------------------------
[leg_servo]
encoder_steps_per_rev = {value = 4096, unit = "steps", source = "datasheet", ref = "https://www.feetechrc.com/en/2020-05-13_56655.html"}
voltage_step_v = {value = 0.1, unit = "V", source = "datasheet", ref = "https://www.feetechrc.com/en/2020-05-13_56655.html"}
current_feedback_step_a = {value = 0.0065, unit = "A", source = "datasheet", ref = "https://www.feetechrc.com/en/2020-05-13_56655.html"}
# Rhoban BAM, bam/params/feetech_sts3215_7_4V/m6.json (the most complete of the six fitted models)
command_delay_s = {value = 0.0049807526194816515, unit = "s", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
bus_baud = {value = 1000000, unit = "baud", source = "estimate", why = "the firmware opens the FE-URT-1 at 1 Mbaud (robot/backends.py RealBackend); the STS3215 default is 1 Mbaud, not read from a datasheet today", ref = "robot/backends.py"}
sync_write_bytes_per_servo = {value = 7, unit = "bytes", source = "estimate", why = "id + 2-byte position + 2-byte time + 2-byte speed in one SYNC_WRITE row; from robot/feetech_bus.py, not checked against Feetech's protocol manual today", ref = "robot/feetech_bus.py"}
bus_overhead_bytes = {value = 8, unit = "bytes", source = "estimate", why = "header, id, length, instruction, address, data length, checksum of one SYNC_WRITE packet", ref = "robot/feetech_bus.py"}
idle_current_a = {value = 0.04, unit = "A", source = "estimate", why = "a holding servo with torque on draws a few tens of mA; no number published for the STS3215", ref = "hardware/electronics.md"}

# --- the measured motor model of the v2 design (docs/dev/V2_MODEL.md): Rhoban BAM m6, fitted at 7.4 V and firmware
# gain 32 (read with gh api on 2026-11-21; copy in sim/sizing/bam_sts3215_m6.json). The gear version is inferred.
model_name = {value = "m6", unit = "-", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
supply_v = {value = 7.4, unit = "V", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/feetech/actuator.py"}
firmware_kp = {value = 32, unit = "-", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/feetech/actuator.py"}
error_gain = {value = 0.166, unit = "duty per (kp*rad)", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/feetech/actuator.py", why = "BAM read this off an oscilloscope on real STS3215 servos (comment in actuator.py)"}
max_pwm = {value = 0.97, unit = "fraction", source = "estimate", why = "BAM marks the 0.97 maximum duty as TODO (found with an oscilloscope, not fitted); 1.0 would be the other plausible value", ref = "https://github.com/Rhoban/bam/blob/main/bam/feetech/actuator.py"}
kt_nm_per_a = {value = 1.2753202369175398, unit = "N*m/A", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
resistance_ohm = {value = 2.753421214375944, unit = "ohm", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
armature_kgm2 = {value = 0.021564290129722483, unit = "kg*m^2", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
error_gain_ratio = {value = 1.1616979929275297, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
max_velocity_rad_s = {value = 5.095754044445978, unit = "rad/s", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
friction_base = {value = 0.0533134815909817, unit = "N*m", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
friction_stribeck = {value = 4.257322248151969e-05, unit = "N*m", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
friction_viscous = {value = 0.028160537042911545, unit = "N*m*s/rad", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_motor = {value = 0.044912012282132555, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_external = {value = 0.24355483356616028, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_motor_stribeck = {value = 0.00012448975632695385, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_external_stribeck = {value = 0.1422905635963302, unit = "ratio", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_motor_quad = {value = 0.007594943296670792, unit = "1/(N*m)", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
load_friction_external_quad = {value = 0.00340408727365082, unit = "1/(N*m)", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
dtheta_stribeck = {value = 0.371136775424206, unit = "rad/s", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
alpha = {value = 9.93094944677977, unit = "-", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json"}
stall_torque_nm = {value = 3.427506733774023, unit = "N*m", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json", why = "supply_v * kt / R from the same file: the torque at standstill with the full supply; the maker's printed 19.5 kg*cm (1.91 N*m) is lower, see docs/dev/V2_MODEL.md"}
no_load_speed_rad_s = {value = 5.802464185690227, unit = "rad/s", source = "measured", ref = "https://github.com/Rhoban/bam/blob/main/bam/params/feetech_sts3215_7_4V/m6.json", why = "supply_v / kt: where the back-EMF cancels the supply; the firmware limits the target to max_velocity long before"}

# ---- arm servos: GOTECK GS-4308MG, plain 50 Hz PWM, no feedback ---------------------------------------------
[arm_servo]
pwm_frame_s = {value = 0.02, unit = "s", source = "estimate", why = "our hardware PWM runs exact 50 Hz frames (robot/backends.py BoardPWM PERIOD_NS)", ref = "robot/backends.py"}
command_delay_s = {value = 0.015, unit = "s", source = "estimate", why = "a new pulse width is picked up at the next frame (10 ms on average, 20 ms worst) plus about 5 ms for the servo's own electronics; matches crab/params.py GS4308 'up to 20 ms latency'", ref = "crab/params.py"}
idle_current_a = {value = 0.015, unit = "A", source = "estimate", why = "a hobby servo's amplifier idles at about 10-20 mA", ref = "hardware/electronics.md"}

# ---- IMU: Bosch BNO055 in IMU fusion mode (gyro + accelerometer, no magnetometer) ----------------------------
[imu]
fusion_rate_hz = {value = 100, unit = "Hz", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
gyro_noise_rms_dps = {value = 0.3, unit = "deg/s", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
gyro_bandwidth_hz = {value = 32, unit = "Hz", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
gyro_zero_rate_offset_dps = {value = 3.0, unit = "deg/s", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
accel_noise_density_ug = {value = 190, unit = "ug/sqrt(Hz)", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
accel_bandwidth_hz = {value = 62.5, unit = "Hz", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
accel_zero_g_offset_mg = {value = 80, unit = "mg", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf"}
offset_left_after_calibration = {value = 0.25, unit = "fraction", source = "estimate", why = "fusion mode runs a background accelerometer and gyro calibration while standing still; we assume three quarters of the datasheet offset is removed, so the tilt bias is about 1 deg", ref = "hardware/electronics.md"}
fusion_lag_s = {value = 0.03, unit = "s", source = "estimate", why = "the fusion filter smooths the gravity direction; a first-order lag of about 30 ms is typical and not published", ref = "hardware/electronics.md"}
i2c_read_delay_s = {value = 0.004, unit = "s", source = "estimate", why = "a 12-byte read at 400 kHz I2C plus the Linux driver takes a few ms; it makes every sample that much older", ref = "robot/backends.py"}

# ---- cliff beams: 5 x ST VL53L0X time-of-flight ---------------------------------------------------------------
[distance]
count = 5
max_range_m = {value = 2.0, unit = "m", source = "datasheet", ref = "https://www.pololu.com/product/2490"}
accuracy_best_frac = {value = 0.03, unit = "fraction of range", source = "datasheet", ref = "https://www.pololu.com/product/2490"}
resolution_m = {value = 0.001, unit = "m", source = "datasheet", ref = "https://www.pololu.com/product/2490"}
noise_sigma_frac = {value = 0.015, unit = "fraction of range", source = "estimate", why = "the page gives +-3 % as the best-case error; we take half of it as one standard deviation of the shot-to-shot noise", ref = "https://www.pololu.com/product/2490"}
noise_sigma_floor_m = {value = 0.002, unit = "m", source = "estimate", why = "at a few cm the noise does not shrink below a couple of mm", ref = "https://www.pololu.com/product/2490"}
rate_hz = {value = 30, unit = "Hz", source = "estimate", why = "the default 33 ms ranging budget of the ST driver; not read from the datasheet today (Pololu's table lists 50 Hz as the best case)", ref = "https://www.pololu.com/product/2490"}
fov_deg = {value = 25, unit = "deg", source = "estimate", why = "Pololu's comparison table lists 25 deg for this part, but the table cells were misaligned when fetched; not confirmed (the twin's beams are single rays, so this is not used yet)", ref = "https://www.pololu.com/product/2490"}
reliable_range_m = {value = 0.4, unit = "m", source = "estimate", why = "indoors with ambient light and a dark floor, readings get unreliable beyond a few tens of cm; ST's accuracy tables are for white targets in the dark", ref = "https://www.pololu.com/product/2490"}
dropout_short = {value = 0.002, unit = "probability per reading", source = "estimate", why = "a very occasional invalid reading even on a good surface (phase failure)", ref = "https://www.pololu.com/product/2490"}
dropout_at_max = {value = 0.5, unit = "probability per reading", source = "estimate", why = "chance of no answer at the end of the working range, rising linearly from reliable_range_m", ref = "https://www.pololu.com/product/2490"}

# ---- battery monitor: TI INA219 with the 10 mOhm shunt (hardware/BOM.md) -----------------------------------
[power_monitor]
shunt_ohm = 0.01
bus_voltage_step_v = {value = 0.004, unit = "V", source = "datasheet", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf"}
shunt_voltage_step_v = {value = 0.00001, unit = "V", source = "datasheet", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf"}
conversion_time_s = {value = 0.000532, unit = "s", source = "datasheet", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf"}
gain_error_frac = {value = 0.005, unit = "fraction", source = "datasheet", ref = "https://www.ti.com/product/INA219"}
shunt_noise_v = {value = 0.00002, unit = "V", source = "estimate", why = "about 2 LSB of shunt noise; the datasheet gives ADC noise only as a graph we did not digitise", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf"}

# ---- touch: NXP MPR121 -------------------------------------------------------------------------------------
[touch]
adc_bits = {value = 10, unit = "bits", source = "datasheet", ref = "https://www.nxp.com/docs/en/data-sheet/MPR121.pdf"}
electrodes = {value = 12, unit = "channels", source = "datasheet", ref = "https://www.nxp.com/docs/en/data-sheet/MPR121.pdf"}
sample_interval_s = {value = 0.016, unit = "s", source = "estimate", why = "16 ms is the sample period the datasheet quotes its run current at (54 uA); the real period is set by registers we configure ourselves", ref = "https://www.nxp.com/docs/en/data-sheet/MPR121.pdf"}

# ---- camera: OV5647 with a 160 degree lens -------------------------------------------------------------------
[camera]
fov_deg = {value = 160, unit = "deg", source = "estimate", why = "the listing says 160 deg (hardware/BOM.md); a fisheye's usable field is smaller and we have not measured it", ref = "hardware/BOM.md"}
frame_rate_hz = {value = 30, unit = "Hz", source = "estimate", why = "a typical OV5647 video mode; the mode we will use is not chosen yet", ref = "hardware/BOM.md"}
latency_s = {value = 0.1, unit = "s", source = "estimate", why = "exposure + CSI readout + ISP + the vision model: about 3 frames at 30 Hz", ref = "hardware/BOM.md"}

# ---- microphones: 2 x I2S MEMS --------------------------------------------------------------------------------
[microphones]
count = 2
spacing_m = {value = 0.07, unit = "m", source = "estimate", why = "they sit about 70 mm apart in the dome (hardware/electronics.md wiring table)", ref = "hardware/electronics.md"}
sample_rate_hz = {value = 16000, unit = "Hz", source = "estimate", why = "common speech rate for I2S capture; not chosen yet", ref = "hardware/BOM.md"}

# ---- battery: Bonka 2S 850 mAh 25C LiPo -----------------------------------------------------------------------
[battery]
cells = 2
capacity_ah = {value = 0.85, unit = "Ah", source = "estimate", why = "the vendor listing in hardware/BOM.md says 850 mAh; not re-read today and a real pack delivers a little less", ref = "hardware/BOM.md"}
usable_fraction = {value = 0.8, unit = "fraction", source = "estimate", why = "the same 80 % usable assumption as hardware/electronics.md; the monitor stops the robot at 6.4 V before the pack is flat", ref = "hardware/electronics.md"}
internal_resistance_ohm = {value = 0.10, unit = "ohm", source = "estimate", why = "a small 2S 25C pack is typically 60-120 mOhm; no measurement yet (measure with the INA219 under load once it exists)", ref = "hardware/BOM.md"}
resistance_rise_at_empty = {value = 2.0, unit = "times", source = "estimate", why = "LiPo resistance roughly doubles near empty", ref = "hardware/BOM.md"}
# open-circuit volts per cell at state of charge 1.0, 0.9 ... 0.0
ocv_per_cell_v = {value = [4.20, 4.07, 3.98, 3.90, 3.84, 3.79, 3.75, 3.71, 3.66, 3.57, 3.30], unit = "V", source = "estimate", why = "a typical LiPo rest-voltage curve; not measured on this pack", ref = "hardware/BOM.md"}

# ---- regulators: 2 x 5 V 5 A buck (7Semi AP64500) ---------------------------------------------------------------
[regulator]
output_v = {value = 5.0, unit = "V", source = "estimate", why = "fixed 5 V buck (hardware/BOM.md)", ref = "hardware/BOM.md"}
current_limit_a = {value = 5.0, unit = "A", source = "estimate", why = "the board is sold as 5 A (hardware/BOM.md); the chip's own limit was not read today", ref = "hardware/BOM.md"}
efficiency = {value = 0.9, unit = "fraction", source = "estimate", why = "same 90 % as hardware/electronics.md", ref = "hardware/electronics.md"}
dropout_v = {value = 0.5, unit = "V", source = "estimate", why = "a buck needs its input about half a volt above the output to hold regulation", ref = "hardware/BOM.md"}
wiring_resistance_ohm = {value = 0.05, unit = "ohm", source = "estimate", why = "regulator output, 20 AWG wire, hub and 900 mm servo cables to the servo", ref = "hardware/electronics.md"}
overload_droop_ohm = {value = 1.0, unit = "ohm", source = "estimate", why = "past the current limit the output folds back; we model it as a steep droop", ref = "hardware/BOM.md"}
computer_load_w = {value = 4.0, unit = "W", source = "estimate", why = "Radxa ZERO 3W with Wi-Fi, camera and sensors, as assumed in hardware/electronics.md", ref = "hardware/electronics.md"}

# ---- the v2 design's power: 2S 1500 mAh pack and a 7.4 V buck-boost servo rail (docs/research/SIZING_STS3215.md) ----
# crab/electronics.py reads these in place of [battery] / [regulator] when CRAB_DESIGN=v2.
[battery_v2]
cells = 2
capacity_ah = {value = 2.5, unit = "Ah", source = "datasheet", ref = "https://www.18650batterystore.com/products/samsung-25r-18650", why = "the BOM pack is two Samsung INR18650-25R cells in series (2S1P), 2500 mAh each at a 0.2 C discharge; a real pack delivers a little less"}
usable_fraction = {value = 0.8, unit = "fraction", source = "estimate", why = "same 80 % usable assumption as the v1 pack", ref = "hardware/electronics.md"}
internal_resistance_ohm = {value = 0.06, unit = "ohm", source = "estimate", why = "two 25R cells: 13.2 mOhm AC at 1 kHz each (datasheet), about 1.7 times that at DC, so 45 mOhm for the pair, plus 15 mOhm for the BMS MOSFETs and tabs; measure with the INA219 under load", ref = "https://www.18650batterystore.com/products/samsung-25r-18650"}
bms_trip_a = {value = 25.0, unit = "A", source = "estimate", why = "the listing gives 8C = 20 A for the cells and no BMS limit; a 2S BMS for 18650 packs usually cuts between 15 and 30 A (the 15 A fuse blows first either way)", ref = "hardware/BOM.md"}
bms_trip_s = {value = 0.1, unit = "s", source = "estimate", why = "typical BMS short-circuit / over-current delay of 10-200 ms", ref = "hardware/BOM.md"}
resistance_rise_at_empty = {value = 2.0, unit = "times", source = "estimate", why = "LiPo resistance roughly doubles near empty", ref = "hardware/BOM.md"}
ocv_per_cell_v = {value = [4.20, 4.07, 3.98, 3.90, 3.84, 3.79, 3.75, 3.71, 3.66, 3.57, 3.30], unit = "V", source = "estimate", why = "a typical LiPo rest-voltage curve; not measured on this pack", ref = "hardware/BOM.md"}

[regulator_v2]
output_v = {value = 7.4, unit = "V", source = "estimate", why = "our design choice: the supply voltage BAM fitted the STS3215 at (bam/feetech/actuator.py), so the measured model applies", ref = "docs/research/SIZING_STS3215.md"}
current_limit_a = {value = 12.0, unit = "A", source = "estimate", why = "walking peaks are far below 12 servos x 2.99 A stall (the sizing study); a regulator for the walking peak plus fall margin is not chosen yet", ref = "docs/research/SIZING_STS3215.md"}
efficiency = {value = 0.9, unit = "fraction", source = "estimate", why = "same 90 % as the 5 V buck; a buck-boost is typically a little lower", ref = "hardware/electronics.md"}
dropout_v = {value = 0.0, unit = "V", source = "estimate", why = "a buck-boost holds 7.4 V from a pack that is above or below it; the 2S pack is 8.4 V full", ref = "docs/research/SIZING_STS3215.md"}
wiring_resistance_ohm = {value = 0.05, unit = "ohm", source = "estimate", why = "same wiring as the 5 V rail", ref = "hardware/electronics.md"}
overload_droop_ohm = {value = 1.0, unit = "ohm", source = "estimate", why = "past the current limit the output folds back; modelled as a steep droop", ref = "hardware/BOM.md"}
computer_load_w = {value = 4.0, unit = "W", source = "estimate", why = "Radxa ZERO 3W with Wi-Fi, camera and sensors, as assumed in hardware/electronics.md", ref = "hardware/electronics.md"}

# ====================================================================================================================
# The v2 circuit (crab/wiring.py solves it from configs/wiring_v2.toml every control tick; docs/dev/ELECTRONICS.md)
# ====================================================================================================================

# ---- the two 5 V regulators: 7Semi AP64500 module ----------------------------------------------------------------
[regulator_5v]
output_v = {value = 5.0, unit = "V", source = "datasheet", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter"}
current_limit_a = {value = 5.0, unit = "A", source = "datasheet", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter", why = "5 A continuous per the listing"}
module_min_input_v = {value = 7.0, unit = "V", source = "datasheet", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter", why = "the listing's 7-40 V input range; the chip itself starts at 3.8 V (next line), the module's 7 V is a board-level rating"}
chip_min_input_v = {value = 3.8, unit = "V", source = "datasheet", ref = "https://www.diodes.com/part/AP64500"}
dropout_v = {value = 0.6, unit = "V", source = "estimate", why = "a buck at 5 V out needs its input about 0.5-0.7 V higher (maximum duty cycle < 100 %); the AP64500 curve was not digitised", ref = "https://www.diodes.com/part/AP64500"}
peak_efficiency = {value = 0.90, unit = "fraction", source = "datasheet", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter", why = "'up to 90 %' per the listing"}
efficiency_points = {value = [[0.05, 0.70], [0.2, 0.82], [1.0, 0.90], [5.0, 0.89]], unit = "[A out, fraction]", source = "estimate", why = "a typical buck curve through the listing's 90 % peak; light-load efficiency is worse; not measured on this module", ref = "https://hubtronics.in/ap64500-5v-5a-dc-dc-buck-converter"}
quiescent_a = {value = 0.004, unit = "A", source = "estimate", why = "module idle draw from the pack: the chip's own plus the power LED", ref = "https://www.diodes.com/part/AP64500"}
overload_droop_ohm = {value = 1.0, unit = "ohm", source = "estimate", why = "past the current limit the output folds back; modelled as a steep droop", ref = "hardware/BOM.md"}
hiccup_factor = {value = 1.3, unit = "x limit", source = "estimate", why = "the chip shuts down and retries when the load stays well above its limit", ref = "https://www.diodes.com/part/AP64500"}
# design switch, not a measurement: true = the module stops below its 7 V rating (see docs/dev/ELECTRONICS.md)
enforce_module_min = false

# ---- the computer (Radxa ZERO 3W) ---------------------------------------------------------------------------------
[computer]
min_input_v = {value = 4.5, unit = "V", source = "estimate", why = "Radxa publishes no minimum; USB-style 5 V inputs are good to 4.75 V and the board's PMIC has a margin: 4.5 V is a conservative reset threshold; measure it", ref = "https://docs.radxa.com/en/zero/zero3"}
hold_up_s = {value = 0.02, unit = "s", source = "estimate", why = "the board's own capacitors ride through a dip this long before it resets", ref = "https://docs.radxa.com/en/zero/zero3"}
boot_s = {value = 30.0, unit = "s", source = "estimate", why = "kernel, services and the pinch app after a reset; Radxa OS boots in about 20 s", ref = "https://docs.radxa.com/en/zero/zero3"}
power_idle_w = {value = 1.3, unit = "W", source = "estimate", why = "RK3566 idle with Wi-Fi associated, camera off; Radxa publishes no figure for the ZERO 3W", ref = "https://docs.radxa.com/en/zero/zero3"}
power_camera_w = {value = 2.1, unit = "W", source = "estimate", why = "idle plus the OV5647 stream and the vision model on the CPU", ref = "https://docs.radxa.com/en/zero/zero3"}
power_npu_w = {value = 3.4, unit = "W", source = "estimate", why = "camera plus the NPU and CPU busy (speech or a large vision model)", ref = "https://docs.radxa.com/en/zero/zero3"}
rail_3v3_limit_a = {value = 0.5, unit = "A", source = "estimate", why = "Radxa publishes no limit for header pins 1 and 17; 0.5 A is the usual budget of a small SBC's 3.3 V pin", ref = "https://docs.radxa.com/en/zero/zero3/hardware-design/hardware-interface"}
rail_3v3_efficiency = {value = 0.85, unit = "fraction", source = "estimate", why = "the board makes 3.3 V from its 5 V input with a buck / LDO mix", ref = "https://docs.radxa.com/en/zero/zero3"}

# ---- current drawn by the small parts (at their own supply: 3.3 V unless said) -------------------------------------
[load]
bno055_a = {value = 0.0123, unit = "A", source = "datasheet", ref = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bno055-ds000.pdf", why = "normal power mode, all sensors and fusion running"}
ina219_a = {value = 0.001, unit = "A", source = "datasheet", ref = "https://www.ti.com/lit/ds/symlink/ina219.pdf", why = "quiescent supply current, 1 mA maximum"}
mpr121_a = {value = 0.001, unit = "A", source = "estimate", why = "the chip runs on tens of uA; the breakout's power LED dominates", ref = "https://www.nxp.com/docs/en/data-sheet/MPR121.pdf"}
oled_a = {value = 0.025, unit = "A", source = "estimate", why = "2.42 inch SSD1309 with a mostly dark face: 20-40 mA depending on lit pixels; no figure on the listing", ref = "hardware/BOM.md"}
vl53l0x_a = {value = 0.020, unit = "A", source = "datasheet", ref = "https://www.pololu.com/product/2490", why = "about 20 mA typical during ranging, 40 mA peak"}
vl53l5cx_a = {value = 0.060, unit = "A", source = "estimate", why = "8x8 ranging at 15 Hz draws tens of mA; the breakout page could not be opened", ref = "hardware/BOM.md"}
mic_a = {value = 0.001, unit = "A", source = "estimate", why = "an I2S MEMS microphone takes about 1 mA", ref = "hardware/BOM.md"}
amp_idle_a = {value = 0.0024, unit = "A", source = "estimate", why = "MAX98357A quiescent current at 5 V, remembered from its datasheet, not fetched", ref = "https://www.adafruit.com/product/3006"}
amp_peak_w = {value = 0.625, unit = "W", source = "estimate", why = "the 0.5 W speaker driven flat out at 80 % amplifier efficiency (the mind only plays short tones)", ref = "hardware/BOM.md"}
arm_servo_stall_a = {value = 0.8, unit = "A", source = "estimate", why = "GOTECK lists no current; a metal-gear micro servo stalls at 0.7-0.9 A at 5-6 V", ref = "crab/params.py"}
pogo_charge_a = {value = 2.0, unit = "A", source = "estimate", why = "the dock charger module's 2 A output (BOM row robu 1794300, read 2026-11-21); the pack takes it through the BMS", ref = "hardware/BOM.md"}

# ---- protection and switching ---------------------------------------------------------------------------------------
[fuse]
rating_a = {value = 15.0, unit = "A", source = "datasheet", ref = "https://www.manualsdir.com/manuals/292034/littelfuse-tac-series.html", why = "the BOM's 15 A 32 V ATC blade fuse (robu R260439)"}
resistance_mohm = {value = 7.0, unit = "mOhm", source = "estimate", why = "about 5 mOhm for a cold 15 A blade plus 2 mOhm for the holder's contacts", ref = "hardware/BOM.md"}
# time to open, seconds, at multiples of the rating: 110 % and 135 % are the datasheet limits of the TAC (ATO-type) series
# (110 %: at least 360000 s; 135 %: 0.75 s to 1800 s, taken as their geometric mean 36.7 s); the 200 / 350 / 600 % points
# are typical values of the ATO family remembered, not fetched.
curve = {value = [[1.10, 360000.0], [1.35, 36.7], [2.0, 0.87], [3.5, 0.09], [6.0, 0.03]], unit = "[x rating, s]", source = "estimate", why = "datasheet limits at 110 % and 135 % (geometric mean of min and max); typical ATO values for the rest", ref = "https://www.manualsdir.com/manuals/292034/littelfuse-tac-series.html"}
cooling_s = {value = 10.0, unit = "s", source = "estimate", why = "the element cools in seconds once the current drops below its rating", ref = "hardware/BOM.md"}

[switch]
rating_a = {value = 20.0, unit = "A", source = "estimate", why = "the BOM's ASW-15D 12 V 20 A rocker; the seller's figure, not measured", ref = "hardware/BOM.md"}
contact_mohm = {value = 15.0, unit = "mOhm", source = "estimate", why = "rocker switches list 10-50 mOhm initial contact resistance; not listed for this one", ref = "hardware/BOM.md"}

[shunt]
ohm = {value = 0.005, unit = "ohm", source = "estimate", why = "the BOM's 0.005 ohm 2512 resistor replaces the INA219 board's 0.1 ohm one; its tolerance and the part itself are not bought yet (BOM: UNVERIFIED)", ref = "hardware/BOM.md"}

# ---- connectors (rating per contact, resistance per mated pair) -------------------------------------------------------
[connector.xt60]
rating_a = {value = 30.0, unit = "A", source = "estimate", why = "Amass XT60: 30 A continuous, remembered from the drawing, not fetched", ref = "hardware/BOM.md"}
contact_mohm = {value = 0.5, unit = "mOhm", source = "estimate", why = "gold-plated bullet contacts, well under 1 mOhm", ref = "hardware/BOM.md"}
[connector.kk5264]
rating_a = {value = 3.0, unit = "A", source = "estimate", why = "the 2.54 mm 3-pin housing of the servo cables (Molex KK 254 / 5264 class) is rated about 3 A per contact; the STS3215 stalls at 2.7 A (Waveshare)", ref = "https://www.waveshare.com/wiki/ST3215_Servo"}
contact_mohm = {value = 10.0, unit = "mOhm", source = "estimate", why = "a tin crimp contact mated: 5-20 mOhm", ref = "hardware/BOM.md"}
[connector.header254]
rating_a = {value = 3.0, unit = "A", source = "estimate", why = "a 2.54 mm pin header pin: about 3 A", ref = "hardware/BOM.md"}
contact_mohm = {value = 10.0, unit = "mOhm", source = "estimate", why = "pin and housing", ref = "hardware/BOM.md"}
[connector.dupont]
rating_a = {value = 1.0, unit = "A", source = "estimate", why = "female Dupont jumper crimps are good for about 1 A; the Radxa's 5 V input uses two pins in parallel", ref = "hardware/BOM.md"}
contact_mohm = {value = 20.0, unit = "mOhm", source = "estimate", why = "jumper crimp on a header pin", ref = "hardware/BOM.md"}
[connector.pogo]
rating_a = {value = 1.0, unit = "A", source = "estimate", why = "the P50-E2 listing gives no rating (BOM: check before trusting it with 2 A); a 1.3 mm spring pin is good for about 1 A, so two pins carry each polarity", ref = "hardware/BOM.md"}
contact_mohm = {value = 50.0, unit = "mOhm", source = "estimate", why = "a spring probe on a copper plate: tens of mOhm", ref = "hardware/BOM.md"}
[connector.usbc]
