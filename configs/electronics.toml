contact_mohm = {value = 30.0, unit = "mOhm", source = "estimate", why = "USB-C cables are specified at up to 40 mOhm per contact path", ref = "hardware/BOM.md"}
[connector.fpc22]
rating_a = {value = 0.5, unit = "A", source = "estimate", why = "a 0.5 mm pitch flex carries about 0.5 A per contact; the camera takes 0.15 A", ref = "hardware/BOM.md"}
contact_mohm = {value = 50.0, unit = "mOhm", source = "estimate", why = "FPC contact", ref = "hardware/BOM.md"}
[connector.jst]
rating_a = {value = 2.0, unit = "A", source = "estimate", why = "JST-PH / SH class housings: 1-2 A", ref = "hardware/BOM.md"}
contact_mohm = {value = 20.0, unit = "mOhm", source = "estimate", why = "crimp contact", ref = "hardware/BOM.md"}

[ratings]
transient_factor = {value = 2.0, unit = "x", source = "estimate", why = "a connector or wire may carry its continuous rating times this for a stall of 2 s or less (the servo's overload protection cuts a longer one); wires and contacts heat over tens of seconds", ref = "hardware/BOM.md"}
slack_factor = {value = 1.25, unit = "x", source = "estimate", why = "a wire is longer than the straight distance between its two parts: it bends around other parts", ref = "hardware/BOM.md"}
service_loop_mm = {value = 40.0, unit = "mm", source = "estimate", why = "extra length at each wire for stripping, soldering and strain relief", ref = "hardware/BOM.md"}

