[experiment]
name = "gait-v2-sts3215"
env = "gait_v2"
preset = "gait_v2"
design = "v2"
description = "walking v2 on the resized robot (CRAB_DESIGN=v2): the STS3215's BAM-measured model in first-order form (decision 103)"

[compute]
min_vram_gb = 6
small_gpu_num_envs = 2048
timeout_min = 1440
gpu = "A10G"
cloud_ok = false               # free GPUs only (msi-1); paid compute needs the owner's yes

[eval]
skill = "gait"
commands = [
  "sim/benches/robustness.py --what walk --world desk --episodes 200",
]
