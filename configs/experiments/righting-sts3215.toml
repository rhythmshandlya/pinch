[experiment]
name = "righting-sts3215"
env = "righting"
preset = "righting"
design = "v2"
description = "get-up on the resized robot (CRAB_DESIGN=v2): the STS3215's BAM-measured model in first-order form (decision 103)"

[overrides]
num_timesteps = 40_000_000     # as the adopted righting-v1

[compute]
min_vram_gb = 6
small_gpu_num_envs = 2048
timeout_min = 1440
gpu = "A10G"
cloud_ok = false               # free GPUs only (msi-1); paid compute needs the owner's yes

[eval]
skill = "righting"
commands = ["sim/benches/righting.py --policy {candidate} --starts 200"]
