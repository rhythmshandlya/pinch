[experiment]
name = "righting-v21"
env = "righting"
preset = "righting"
init_from = "/home/armaan/pinch-jobs/righting-v21e/out/righting-v21e/params.pkl"   # warm start: the 12 M-step check (80 % on the CAD body), itself from the adopted righting-v1
description = "quick check of design v2.1 (design sweep winner): get up from any orientation within 2 s on this body (R-07)"

[overrides]
num_timesteps = 40_000_000     # as the adopted righting-v1 (msi-1: about 2 900 steps/s, ~4 h)
num_evals = 10

[compute]
min_vram_gb = 6
small_gpu_num_envs = 2048
timeout_min = 1440
gpu = "A10G"
cloud_ok = false               # free GPUs only (msi-1); paid compute needs the owner's yes

[eval]
skill = "righting"
commands = ["sim/benches/righting.py --policy {candidate} --starts 200"]
