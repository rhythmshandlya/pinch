[experiment]
name = "righting-v21-cold"
env = "righting"
preset = "righting"
design = "v2"
description = "A/B check: righting-v21 without the warm start (is the slow start the warm start?)"

[overrides]
num_timesteps = 40_000_000     # as the adopted righting-v1

[compute]
min_vram_gb = 6
small_gpu_num_envs = 2048
timeout_min = 1440
gpu = "A10G"
cloud_ok = false               # free GPUs only (msi-1); paid compute needs the owner's yes

[eval]
skill = "righting"
commands = ["sim/benches/righting.py --policy {candidate} --starts 200"]
