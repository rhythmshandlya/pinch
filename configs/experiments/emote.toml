[experiment]
name = "emote"
env = "emote2"
preset = "emote"
description = "balance while emoting, in the twin's 2 ms physics"

[compute]
min_vram_gb = 6
small_gpu_num_envs = 2048
timeout_min = 150
gpu = "A10G"
cloud_ok = true

[eval]
skill = "emote"
commands = ["sim/benches/robustness.py --what emote --world desk --episodes 40"]
