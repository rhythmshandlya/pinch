# PPO presets (Brax). An experiment (configs/experiments/*.toml) names one and may override any key.
# num_envs suits a 24 GB GPU; an experiment's [compute] small_gpu_num_envs is used on 6-8 GB cards.

[smoke]
num_timesteps = 12800
num_envs = 16
batch_size = 16
num_minibatches = 4
unroll_length = 10
num_updates_per_batch = 2
episode_length = 200
num_evals = 2
num_eval_envs = 16
learning_rate = 0.0003
entropy_cost = 0.01
discounting = 0.97
policy_layers = [64, 64]
value_layers = [64, 64]

