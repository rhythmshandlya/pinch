id = "pack_xt60"
from = "PACK"
to = "XT_A"
awg = 14
length_mm = 150
connectors = ["xt60"]
parts = ["pack", "xt60"]
note = "the pack's 15 cm 14 AWG XT60 pigtail"
[[edge]]
id = "xt60_fuse"
from = "XT_A"
to = "FUSE_IN"
awg = 14
length_mm = "auto"
connectors = []
parts = ["xt60", "fuse"]
note = "XT60 female pigtail to the fuse holder"
[[edge]]
id = "fuse"
from = "FUSE_IN"
to = "FUSE_OUT"
element = "fuse"
parts = ["fuse"]
[[edge]]
id = "fuse_ina"
from = "FUSE_OUT"
to = "SHUNT_IN"
awg = 14
length_mm = "auto"
connectors = []
parts = ["fuse", "ina"]
[[edge]]
