# The wiring of the v2 robot: every power connection and every signal, as data (docs/dev/ELECTRONICS.md "Wiring").
# Read and CHECKED by crab/wiring.py (`python -m crab.wiring` prints the result); the circuit simulation of the twin
# solves its power part every control tick; hardware/wiring_diagram.py draws hardware/wiring.svg from it.
#
# Numbers about parts (wire resistance, connector ratings, the fuse's curve, regulator behaviour, small-part currents) live
# in configs/electronics.toml with their source; this file is the TOPOLOGY: which part connects to which, with what wire.
# Parts are the names in configs/layout_v2.toml. An edge's length is `"auto"` (the straight distance of its two parts in
# the layout x rules slack + a service loop) or a number in mm (a bought cable).
#
# Power: PACK -> XT60 -> fuse -> shunt (INA219) -> switch -> {hub (7.4 V servo rail), regulator A, regulator B}.
#   regulator A (5 V): Radxa, audio, and through the Radxa's own 3.3 V pins the sensors
#   regulator B (5 V): the six arm servos, on their own hub headers (never joined to the 7.4 V leg headers)
# Return (ground) conductors are the same wire as the supply ones: the resistance of an edge is a loop.

[meta]
design = "v2"
radxa_source = "https://docs.radxa.com/en/zero/zero3/hardware-design/hardware-interface"
radxa_note = "pin functions as printed in Radxa's 40-pin table (read 2026-11-21). The table lists NO I2C function on pins 3 and 5, only GPIO and UART3: that bus is the kernel's i2c-gpio driver (any two GPIOs), not a hardware I2C controller."

[rules]
i2c_max_utilisation = 0.6
servo_bus_max_stub_mm = 1500
servo_bus_baud = 1000000
# 3-wire hobby / bus servo cables are bought: 900 mm for the 12 leg servos, 500 mm (a guess) for the arms

[radxa.pin]
"1" = ["+3.3V"]
"2" = ["+5.0V"]
"3" = ["GPIO1_A0", "UART3_RX_M0"]
"4" = ["+5.0V"]
"5" = ["GPIO1_A1", "UART3_TX_M0"]
"6" = ["GND"]
"7" = ["GPIO3_C4", "PWM14_M0"]
"8" = ["GPIO0_D1", "UART2_TX_M0"]
"9" = ["GND"]
"10" = ["GPIO0_D0", "UART2_RX_M0"]
"11" = ["GPIO3_A1"]
"12" = ["GPIO3_A3", "I2S3_SCLK_M0"]
"13" = ["GPIO3_A2", "I2S3_MCLK_M0"]
"14" = ["GND"]
"15" = ["GPIO3_B0"]
"16" = ["GPIO3_B1", "UART4_RX_M1", "PWM8_M0"]
"17" = ["+3.3V"]
"18" = ["GPIO3_B2", "UART4_TX_M1", "PWM9_M0"]
"19" = ["GPIO4_C3", "PWM15_IR_M1", "I2S3_SCLK_M1", "SPI3_MOSI_M1"]
"20" = ["GND"]
"21" = ["GPIO4_C5", "UART9_TX_M1", "PWM12_M1", "I2S3_SDO_M1", "SPI3_MISO_M1"]
"22" = ["GPIO3_C1", "I2S1_SDO2_M2"]
"23" = ["GPIO4_C2", "PWM14_M1", "I2S3_MCLK_M1", "SPI3_CLK_M1"]
"24" = ["GPIO4_C6", "SPI3_CS0_M1", "PWM13_M1", "UART9_RX_M1", "I2S3_SDI_M1"]
"25" = ["GND"]
"26" = ["NC"]
"27" = ["GPIO4_B2", "I2C4_SDA_M0", "I2S2_SDI_M1"]
"28" = ["GPIO4_B3", "I2C4_SCL_M0", "I2S2_SDO_M1"]
"29" = ["GPIO3_B3", "I2C5_SCL_M0"]
"30" = ["GND"]
"31" = ["GPIO3_B4", "I2C5_SDA_M0"]
"32" = ["GPIO3_C2", "UART5_TX_M1", "I2S1_SDO3_M2"]
"33" = ["GPIO3_C3", "UART5_RX_M1", "I2S1_SCLK_RX_M2"]
"34" = ["GND"]
"35" = ["GPIO3_A4", "I2S3_LRCK_M0"]
"36" = ["GPIO3_A7"]
"37" = ["GPIO1_A4", "I2S1_SCLK_RX_M0"]
"38" = ["GPIO3_A6", "I2S3_SDI_M0"]
"39" = ["GND"]
"40" = ["GPIO3_A5", "I2S3_SDO_M0"]

# ---- I2C devices: default and possible addresses (datasheets), whether the chip stretches the clock, traffic ----
[device.bno055]
addresses = [0x28, 0x29]
stretches_clock = true
bytes_per_s = 2000
note = "Bosch BNO055: address 0x28 with COM3 low, 0x29 with COM3 high. It holds the clock line low for long (docs/research/audit/ext_runtime_power.md section 6): it gets a bus of its own."
[device.ina219]
addresses = [0x40, 0x41, 0x44, 0x45]
bytes_per_s = 600
note = "TI INA219: A0/A1 pins select 16 addresses 0x40-0x4F."
[device.mpr121]
addresses = [0x5A, 0x5B, 0x5C, 0x5D]
bytes_per_s = 400
note = "NXP MPR121: the ADDR pin selects 0x5A-0x5D."
[device.ssd1309]
addresses = [0x3C, 0x3D]
bytes_per_s = 10500
note = "SSD1309 OLED: 10 frames per second of 1024 bytes plus commands."
[device.vl53l0x]
addresses = [0x29]
readdressable = true
bytes_per_s = 600
note = "ST VL53L0X: every one wakes at 0x29; hold the others in reset with XSHUT, give each its own address, release the next."
[device.vl53l5cx]
addresses = [0x29]
readdressable = true
bytes_per_s = 7500
note = "ST VL53L5CX: wakes at 0x29 too; LPn low holds it in reset, and its address can be changed in software."

# ---- the I2C buses -------------------------------------------------------------------------------------------------
[[i2c]]
name = "i2c3"
controller = "i2c-gpio overlay (software, kernel driver)"
sda = 3
scl = 5
speed_khz = 400
devices = [
  {part = "ina", kind = "ina219", addr = 0x40},
  {part = "mpr121", kind = "mpr121", addr = 0x5A},
  {part = "oled", kind = "ssd1309", addr = 0x3C},
]
[[i2c]]
name = "i2c4"
controller = "I2C4_M0"
sda = 27
scl = 28
speed_khz = 400
devices = [
  {part = "imu", kind = "bno055", addr = 0x28},
]
[[i2c]]
name = "i2c5"
controller = "I2C5_M0"
sda = 31
scl = 29
speed_khz = 400
devices = [
  {part = "tof_fl", kind = "vl53l0x", boot_addr = 0x29, addr = 0x30, reset_pin = 11},
  {part = "tof_fr", kind = "vl53l0x", boot_addr = 0x29, addr = 0x31, reset_pin = 13},
  {part = "tof_rear", kind = "vl53l0x", boot_addr = 0x29, addr = 0x32, reset_pin = 15},
  {part = "tof_left", kind = "vl53l0x", boot_addr = 0x29, addr = 0x33, reset_pin = 22},
  {part = "tof_right", kind = "vl53l0x", boot_addr = 0x29, addr = 0x34, reset_pin = 36},
  {part = "tof8", kind = "vl53l5cx", boot_addr = 0x29, addr = 0x35, reset_pin = 32},
]

# ---- the six arm servos: hardware PWM, 50 Hz; `channel` = robot/servos.py PWM_CHANNEL ---------------------------------

[[pwm]]
channel = 0
pin = 16
function = "PWM8_M0"
joint = "L_shoulder_yaw"
part = "shoulder_l"

[[pwm]]
channel = 1
pin = 18
function = "PWM9_M0"
joint = "L_shoulder_pitch"

[[pwm]]
channel = 2
pin = 21
function = "PWM12_M1"
joint = "L_claw"

[[pwm]]
channel = 3
pin = 24
function = "PWM13_M1"
joint = "R_shoulder_yaw"
part = "shoulder_r"

[[pwm]]
channel = 4
pin = 7
function = "PWM14_M0"
joint = "R_shoulder_pitch"

[[pwm]]
channel = 5
pin = 19
function = "PWM15_IR_M1"
joint = "R_claw"

# ---- I2S (one codec bus, I2S3_M0): speaker amplifier out, two microphones in (left / right by their SEL pin) -----------
[i2s]
bclk = 12
lrck = 35
data_out = 40
data_in = 38
out = [{part = "amp", pin = "DIN"}]
in = [{part = "mic_l", select = "SEL to GND (left)"}, {part = "mic_r", select = "SEL to 3.3 V (right)"}]

# ---- the servo bus: the Waveshare driver board turns USB into the one-wire half-duplex bus, 1 Mbaud. All twelve leg servos
# hang on it in a star at the hub: each servo has its own 900 mm cable from its own hub header, the signal pins are joined
# on the hub board. (A star, not a chain, because a chain would put three servos' current through one 3 A connector.)
# The order of the headers is the servo ID: robot/servos.py SERVO_IDS.
[servo_bus]
driver = "driver"
hub = "hub"
topology = "star at the hub"
baud = 1000000

order = ["FL_coxa", "FL_femur", "FL_tibia", "FR_coxa", "FR_femur", "FR_tibia", "RL_coxa", "RL_femur", "RL_tibia", "RR_coxa", "RR_femur", "RR_tibia"]

# ---- links that are not power wires -----------------------------------------------------------------------------
[[link]]
id = "usb"
kind = "usb"
from_part = "driver"
to_part = "radxa"
connectors = ["usbc", "usbc"]
note = "short USB-C to USB-C data cable into the Radxa's USB host port; shows up as a serial port"
[[link]]
id = "camera"
kind = "csi"
from_part = "camera"
to_part = "radxa"
connectors = ["fpc22", "fpc22"]
note = "22-pin 0.5 mm flex from the camera board to the Radxa's CSI connector"
[[link]]
id = "oled_flex"
kind = "i2c-board"
from_part = "oled"
to_part = "radxa"
connectors = []
note = "STYLE B (face lid): the screen is now the 6.25 inch HDMI panel in the hinged lid; its micro-HDMI flat cable (and its USB power/touch lead, if used) runs through the lid hinge to the Radxa. The Radxa has no HDMI-in-lid cable data yet: this edge keeps the old OLED entry (its 3.3 V load and i2c address 0x3C are NOT removed yet: a data decision) so no pin changes; the I2C address is free once the entry goes. The six arm servos are STS3032 (placeholder, 5 V rail B) but their PWM wiring entries are unchanged"
[[link]]
id = "speaker"
kind = "audio"
from_part = "amp"
to_part = "speaker"
connectors = ["jst"]
note = "the speaker's two leads to the amplifier's output terminals"

[[link]]
id = "electrode_head"
kind = "electrode"
from_part = "mpr121"
to_part = "pad_head"
connectors = []
note = "28 AWG from MPR121 electrode input to the copper pad of zone head; the claw zones are wired through the arms"

[[link]]
