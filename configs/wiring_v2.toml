from = "SHUNT_IN"
to = "SHUNT_OUT"
element = "shunt"
parts = ["ina"]
note = "the 0.005 ohm shunt across the INA219's VIN+ / VIN-: the monitor reads the whole pack current"
[[edge]]
id = "ina_switch"
from = "SHUNT_OUT"
to = "SW_IN"
awg = 14
length_mm = "auto"
connectors = []
parts = ["ina", "switch"]
[[edge]]
