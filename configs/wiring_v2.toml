# ---- the dock charging path (not part of the running circuit): pogo pins -> reverse guard + polyfuses -> the pack's
# charge lead. Two pins in parallel per polarity. The current is the dock charger module's 2 A.
[[charge_edge]]
id = "pogo_l"
from_part = "pogo_l"
to_part = "dock_board"
awg = 22
length_mm = "auto"
connectors = ["pogo"]
parallel = 2
current = "load.pogo_charge_a"
[[charge_edge]]
id = "pogo_r"
from_part = "pogo_r"
to_part = "dock_board"
awg = 22
length_mm = "auto"
connectors = ["pogo"]
parallel = 2
current = "load.pogo_charge_a"
[[charge_edge]]
id = "dock_pack"
from_part = "dock_board"
to_part = "pack"
awg = 22
length_mm = "auto"
connectors = []
parallel = 1
current = "load.pogo_charge_a"

# ---- parts that need no wire of their own in this file ---------------------------------------------------------------
[coverage]
exempt = ["harness", "radxa_heatsink", "camera_lens", "visor"]
exempt_why = "the harness is the wiring itself; the heatsink, the lens barrel and the visor are mounted on a part that is wired"
