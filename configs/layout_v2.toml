# Where every electronic part sits inside the v2 body (docs/dev/ELECTRONICS.md "Placement").
# One file, read by crab/electronics.py (Layout), sim/fit_check.py (the fit check), sim/build_model.py (the MuJoCo
# bodies and the sensor mounts), crab/wiring.py (wire lengths) and robot/backends.py (IMU and beams at their mounts).
#
# Frame: millimetres in the body frame, x front, y left, z up; the hip plane is z = 0. `pos_mm` is the CENTRE of the
# part's box. `size_mm` = L, W, H along the part's own x, y, z. `rpy_deg` = roll, pitch, yaw applied as Rz @ Ry @ Rx.
# `mass_g` in grams. Every part says where its size and its mass came from:
#   *_source = "datasheet"  printed on the maker's / seller's page; *_ref is that page
#   *_source = "measured"   someone measured it
#   *_source = "estimate"   our own reasoning, `why` says how; replace it when the real part is in hand (or measure it)
# `on` = the part is mounted on that other part (they may touch, never go through each other).
# `connectors`: the cable room in front of a plug or terminal (a slab `reach_mm` deep on that face of the part).
# `window`: where a sensor looks out (position in the part's own frame, direction, half-angle of the view cone).
# `wall_mounted`: the part sits in the shell wall (its window is flush with the outside).
# `in_model`: a servo the model builds itself (hips in sim/build_model.py, shoulders in arm_xml); listed here so the
# fit check sees it. `mass_only`: no volume (the harness).

[meta]
design = "v2"
note = "Edit a position, then run `python sim/fit_check.py`; `python sim/build_model.py --design v2` rebuilds the model."

[chassis]
# crab/params.py v2 body (sizing study): printed chassis box + dome shell. tests/test_layout.py keeps these equal.
box_center_mm = [6.9, 0.0, -9.7]
box_half_mm = [67.7, 89.7, 25.0]
dome_center_mm = [9.6, 0.0, 1.6]
dome_half_mm = [73.6, 92.3, 19.0]
wall_mm = 2.0
wall_source = "estimate"
wall_why = "a 2 mm printed PETG shell: 4-5 perimeters of a 0.4 mm nozzle; the CAD does not exist yet"

[rules]
clearance_mm = 1.0
window_depth_tol_mm = 2.5

