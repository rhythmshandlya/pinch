# The adopted policies for the v2.1 body: which run each came from, how it was judged, and the decision that adopted
# it. Change a slot only through the adoption workflow (docs/dev/TRAINING.md): fetch, export, `ops eval`, compare
# with the incumbent, decision entry, then update this file and policies/<slot>.npz in the same commit.
# A skill without a slot here runs its scripted controller (crab/policy_np.py load_policy -> None): walking is the
# scripted trot, moves are the keyframed emotes, grasping and pushing are scripted. Phase 6 trains them for v2.1.
# (The v1 body's policies were retired with the v1 body; they are in git history.)

[righting]
file = "righting.npz"
run = "righting-v21-lag"
steps = 13_762_560
env = "righting"
adopted_in = "phase 4 integration"
decision = 110
evidence = "v2.1 body, 200 random falls on its back: 175/200 = 88 % (82-91) ideal, 1.92 s mean; 191/200 = 96 % (92-98) with datasheet realism (command delay, encoder and IMU noise), 1.42 s mean. Scripted swing 49/200 = 24 %; the v1 policy on v2.1: 38 % / 45 %. Trained with 0-20 ms command latency. Commanded joint speed p95 11.6-13 rad/s against the 5.1 rad/s servo limit (the servos clip it; the numbers above include the clipping)."

[gait]
file = "gait.npz"
run = "terrain-v21-lag"
steps = 60_000_000
env = "terrain_hard"
adopted_in = "phase 4 integration"
decision = 111
evidence = "v2.1 body, corrections on the scripted trot. Robustness (24 episodes per world, paired): desk / rough / stuck / terrain falls 0/0/0/0 (scripted 0/0/0/0), speed tracking 81/80/79/77 % (scripted 73/70/71/62 %), tilt RMS 2.6-2.8 deg (scripted 2.2-2.6). Hurdles forward: 18 mm bars 3/3, 20 mm 2/3 (scripted: 8 mm 3/3, 10 mm 1/3); ramps forward 15 deg 3/3, 20 deg 2/3 (scripted 15 deg 2/3, 20 deg 0/3). Loses one case: sideways up a 20 deg ramp 0/3 (scripted 3/3). Trained with 0-20 ms command latency, 60 M steps on msi-1."
