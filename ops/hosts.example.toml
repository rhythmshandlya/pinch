# Copy to ops/hosts.local.toml (gitignored) and fill in. Every host needs key-based SSH from this machine
# (BatchMode: ops never types a password) and an NVIDIA GPU. Over Tailscale, use the machine's 100.x address or
# its MagicDNS name. `python -m ops hosts check` tests them; `python -m ops hosts bootstrap <name>` prepares one.

[hosts.msi-1]
ssh = "user@100.64.0.1"
os = "windows-wsl"          # the SSH shell is Windows; jobs run inside WSL (JAX's CUDA build needs Linux)
wsl_distro = "Ubuntu"
repo = "~/pinch"
python = ".venv-rl/bin/python"
gpu = "RTX 4050 Laptop"
vram_gb = 6
max_jobs = 1

[hosts.friend-gpu]
ssh = "user@friend-gpu"     # a MagicDNS name on the shared tailnet
os = "linux"
repo = "~/pinch"
python = ".venv-rl/bin/python"
gpu = "RTX 3090"
vram_gb = 24
max_jobs = 1
notes = "rented from a friend: shared via Tailscale node sharing"
